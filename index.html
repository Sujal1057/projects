<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KANVERSE Templates — Preview</title>
  <meta name="description" content="Preview gallery of KANVERSE template products." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo-text {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #737373;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #fafafa;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #525252;
      margin-bottom: 3rem;
      font-weight: 400;
    }

    .info-card {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: left;
    }

    .info-card p {
      font-size: 0.8rem;
      color: #737373;
      line-height: 1.7;
    }

    .info-card code {
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #a3a3a3;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.65rem;
      color: #404040;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="logo-text">KANVERSE</p>
    <h1>Template Previews</h1>
    <p class="subtitle">Internal preview system for template products.</p>

    <div class="info-card">
      <p>
        Each template is accessible at its own path:<br /><br />
        <code>/{category}/{template}/</code><br /><br />
        For example:<br />
        <code>/LOVE/template-01/</code>
      </p>
    </div>
  </div>

  <p class="footer">KANVERSE PREVIEW SYSTEM</p>
</body>
</html>
