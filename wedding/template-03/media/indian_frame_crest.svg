<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" width="100" height="40" fill="none">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="35%" stop-color="#E2B755"/>
      <stop offset="75%" stop-color="#B27E22"/>
      <stop offset="100%" stop-color="#6B4309"/>
    </linearGradient>
    <linearGradient id="crestShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C28B2B"/>
      <stop offset="50%" stop-color="#FFF8D6"/>
      <stop offset="100%" stop-color="#C28B2B"/>
    </linearGradient>
    <filter id="crestShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#26000c" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#crestShadow)">
    <!-- Base mounting bar -->
    <path d="M 20 36 C 35 34 65 34 80 36 C 82 38 80 40 76 40 L 24 40 C 20 40 18 38 20 36 Z" fill="url(#crestGold)"/>

    <!-- Central Kalash / Royal Lotus Spire -->
    <path d="M 50 2 C 51 6 54 10 56 14 C 57 19 54 24 50 28 C 46 24 43 19 44 14 C 46 10 49 6 50 2 Z" fill="url(#crestGold)"/>
    <path d="M 50 5 C 50.8 8 52.5 12 53.5 15 C 54 18 52 22 50 24 C 48 22 46 18 46.5 15 C 47.5 12 49.2 8 50 5 Z" fill="#6A0D28"/>
    <circle cx="50" cy="15" r="2.2" fill="url(#crestShine)"/>
    <circle cx="50" cy="3" r="1.5" fill="#FFF8D6"/>

    <!-- Left Main Lotus Petal / Arch -->
    <path d="M 50 28 C 42 22 36 12 32 16 C 30 19 33 24 37 26 C 41 28 46 29 50 30 Z" fill="url(#crestGold)"/>
    <!-- Right Main Lotus Petal / Arch -->
    <path d="M 50 28 C 58 22 64 12 68 16 C 70 19 67 24 63 26 C 59 28 54 29 50 30 Z" fill="url(#crestGold)"/>

    <!-- Left Outer Filigree Curl -->
    <path d="M 34 26 C 26 23 20 18 16 22 C 14 24 16 28 20 29 C 24 30 28 31 34 32 Z" fill="url(#crestGold)"/>
    <circle cx="15" cy="22" r="2" fill="url(#crestShine)"/>

    <!-- Right Outer Filigree Curl -->
    <path d="M 66 26 C 74 23 80 18 84 22 C 86 24 84 28 80 29 C 76 30 72 31 66 32 Z" fill="url(#crestGold)"/>
    <circle cx="85" cy="22" r="2" fill="url(#crestShine)"/>

    <!-- Base Jewel Plaque -->
    <ellipse cx="50" cy="34" rx="8" ry="4" fill="url(#crestGold)"/>
    <ellipse cx="50" cy="34" rx="5" ry="2.2" fill="#52051E"/>
    <circle cx="50" cy="34" r="1.2" fill="#FFF8D6"/>
  </g>
</svg>

